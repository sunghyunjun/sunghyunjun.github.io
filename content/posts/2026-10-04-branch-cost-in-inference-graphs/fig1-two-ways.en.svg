<svg viewBox="0 0 720 308" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left: when the condition is known before execution, the host picks engine A or B. Right: layers inside a loop contain branches, so the model compiles into one graph that holds If">
<defs><marker id="ccArrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="n-gray"/></marker></defs>
<rect x="8.0" y="8.0" width="348.0" height="292.0" rx="10" class="box-panel" stroke-width="1.2"/>
<text x="188.0" y="40.0" text-anchor="middle" class="lbl n-blue" font-size="16" font-weight="700">Split into two graphs</text>
<text x="188.0" y="63.0" text-anchor="middle" class="lbl-sub" font-size="13">When the condition is known before execution</text>
<rect x="103.0" y="82.0" width="170.0" height="42.0" rx="8" class="box-neutral" stroke-width="1.2"/>
<text x="188.0" y="108.0" text-anchor="middle" class="lbl" font-size="14">Host reads condition</text>
<path d="M188.0 124.0 L110.0 160.0" class="edge" fill="none" stroke-width="1.6" marker-end="url(#ccArrow1)"/>
<path d="M188.0 124.0 L266.0 160.0" class="edge" fill="none" stroke-width="1.6" marker-end="url(#ccArrow1)"/>
<rect x="28.0" y="164.0" width="156.0" height="60.0" rx="8" class="t-blue s-blue" stroke-width="1.5"/>
<text x="106.0" y="189.0" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Engine A</text>
<text x="106.0" y="209.0" text-anchor="middle" class="lbl-sub" font-size="12">branch_fn_0 only</text>
<rect x="192.0" y="164.0" width="156.0" height="60.0" rx="8" class="t-blue s-blue" stroke-width="1.5"/>
<text x="270.0" y="189.0" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Engine B</text>
<text x="270.0" y="209.0" text-anchor="middle" class="lbl-sub" font-size="12">branch_fn_1 only</text>
<text x="188.0" y="266.0" text-anchor="middle" class="lbl-sub" font-size="13">Each engine is a static graph with no branch</text>
<rect x="364.0" y="8.0" width="348.0" height="292.0" rx="10" class="box-panel" stroke-width="1.2"/>
<text x="538.0" y="40.0" text-anchor="middle" class="lbl n-red" font-size="16" font-weight="700">Put the branch inside the graph</text>
<text x="538.0" y="63.0" text-anchor="middle" class="lbl-sub" font-size="13">When the branch is in a loop or there are many</text>
<rect x="384" y="80" width="160" height="166" rx="6" class="edge-dash" fill="none" stroke-width="1.2"/>
<rect x="394.0" y="88.0" width="140.0" height="32.0" rx="6" class="box-neutral" stroke-width="1"/>
<text x="464.0" y="109.0" text-anchor="middle" class="lbl" font-size="13.5">Layer 1</text>
<rect x="394.0" y="127.0" width="140.0" height="32.0" rx="6" class="t-amber s-amber" stroke-width="1.4"/>
<text x="464.0" y="148.0" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700">Layer 2 · if</text>
<rect x="394.0" y="166.0" width="140.0" height="32.0" rx="6" class="box-neutral" stroke-width="1"/>
<text x="464.0" y="187.0" text-anchor="middle" class="lbl" font-size="13.5">Layer 3</text>
<rect x="394.0" y="205.0" width="140.0" height="32.0" rx="6" class="t-amber s-amber" stroke-width="1.4"/>
<text x="464.0" y="226.0" text-anchor="middle" class="lbl" font-size="13.5" font-weight="700">Layer 4 · if</text>
<path d="M552 228 C 580 228, 580 104, 552 104" class="edge" fill="none" stroke-width="1.6" marker-end="url(#ccArrow1)"/>
<text x="588.0" y="152.0" text-anchor="start" class="lbl-sub" font-size="13">Repeat N times</text>
<text x="588.0" y="192.0" text-anchor="start" class="lbl" font-size="13.5" font-weight="700">One graph</text>
<text x="588.0" y="210.0" text-anchor="start" class="lbl" font-size="13.5" font-weight="700">with If inside</text>
<text x="538.0" y="270.0" text-anchor="middle" class="lbl-sub" font-size="12.5">The condition changes every iteration</text>
<text x="538.0" y="288.0" text-anchor="middle" class="lbl-sub" font-size="12.5">n branches need up to 2ⁿ engines</text>
</svg>
