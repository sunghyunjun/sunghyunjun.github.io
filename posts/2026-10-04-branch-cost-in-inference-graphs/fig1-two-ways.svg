<svg viewBox="0 0 720 308" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="왼쪽은 조건을 실행 전에 알 때 host가 엔진 A와 B 중 하나를 고르는 구조, 오른쪽은 루프 안의 레이어에 분기가 들어 있어 If를 품은 그래프 한 벌로 컴파일하는 구조">
