<rect x="8.0" y="8.0" width="348.0" height="292.0" rx="10" class="box-panel" stroke-width="1.2"/>
<text x="188.0" y="40.0" text-anchor="middle" class="lbl n-blue" font-size="16" font-weight="700">그래프를 두 벌로 나누기</text>
<text x="188.0" y="63.0" text-anchor="middle" class="lbl-sub" font-size="13">조건을 실행 전에 알 수 있을 때</text>
