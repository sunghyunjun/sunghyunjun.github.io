<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CPU and GPU timelines. When the condition flows as data the CPU queues kernels ahead and the GPU never waits. When the host reads the condition the CPU waits on sync, decides, then queues the next kernel, leaving the GPU idle in between">
